  <script>
    (function () {
      'use strict';

      // =========================================================================
      // 1. SECURITY, SANITIZATION & UTILITY HELPERS
      // =========================================================================
      const STORAGE_KEY = 'a_legal_note_state_v2';

      function escapeHtml(str) {
        if (str === null || str === undefined) return '';
        return String(str)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#39;');
      }

      async function hashPassword(password) {
        try {
          if (window.crypto && window.crypto.subtle) {
            const data = new TextEncoder().encode('ALN_SALT_2026::' + password);
            const buf = await window.crypto.subtle.digest('SHA-256', data);
            return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
          }
        } catch (e) { /* fallback */ }
        let h = 2166136261;
        const s = 'ALN_SALT_2026::' + password;
        for (let i = 0; i < s.length; i++) {
          h ^= s.charCodeAt(i);
          h = Math.imul(h, 16777619);
        }
        return 'fnv_' + (h >>> 0).toString(16);
      }

      function formatDate(iso) {
        if (!iso) return '—';
        const d = new Date(iso);
        if (isNaN(d.getTime())) return iso;
        return d.toLocaleDateString('en-IN', { year: 'numeric', month: 'short', day: 'numeric' });
      }

      function nowTimestamp() {
        return new Date().toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
      }

      function countWords(text) {
        return (text || '').trim().split(/\s+/).filter(Boolean).length;
      }

      function estimateReadTime(text) {
        return Math.max(2, Math.ceil(countWords(text) / 200)) + ' min read';
      }

      function generateId(prefix) {
        return prefix + '-' + Math.random().toString(36).substring(2, 6).toUpperCase() + '-' + Date.now().toString().slice(-4);
      }

      function copyTextToClipboard(text) {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          return navigator.clipboard.writeText(text).catch(() => fallbackCopy(text));
        }
        return Promise.resolve(fallbackCopy(text));
      }

      function fallbackCopy(text) {
        const ta = document.createElement('textarea');
        ta.value = text;
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.select();
        try { document.execCommand('copy'); } catch (e) { /* ignore */ }
        document.body.removeChild(ta);
      }

      function downloadFile(filename, content, mimeType) {
        const blob = new Blob([content], { type: mimeType });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        a.remove();
        URL.revokeObjectURL(url);
      }

      function showToast(message, type = 'info') {
        const container = document.getElementById('toast-container');
        const toast = document.createElement('div');
        const colors = {
          info: 'bg-gray-900 text-white border-gray-800',
          success: 'bg-emerald-900 text-white border-emerald-800',
          error: 'bg-red-900 text-white border-red-800',
          warning: 'bg-amber-900 text-white border-amber-800'
        };
        toast.className = `px-4 py-2.5 rounded-lg border shadow-lg text-xs font-medium flex items-center gap-2 transition-all duration-200 ${colors[type] || colors.info}`;
        toast.textContent = message;
        container.appendChild(toast);
        setTimeout(() => {
          toast.style.opacity = '0';
          toast.style.transform = 'translateY(6px)';
          setTimeout(() => toast.remove(), 200);
        }, 3200);
      }

      // =========================================================================
      // 2. LEGAL AUTHORITY KNOWLEDGE BASE (STATUTE & CASE AUTO-LINKING)
      // =========================================================================
      const LEGAL_AUTHORITIES = [
        {
          id: 'auth-art14',
          match: 'Article 14',
          title: 'Article 14, Constitution of India',
          kind: 'Constitutional Provision',
          citation: 'INDIA CONST. art. 14',
          summary: 'Guarantees equality before the law and equal protection of the laws; encompasses the doctrinal bar against manifest arbitrariness in state action.'
        },
        {
          id: 'auth-art21',
          match: 'Article 21',
          title: 'Article 21, Constitution of India',

          citation: 'INDIA CONST. art. 21',

        },
        {
          id: 'auth-dpdp',

        {
          id: 'auth-arb17',

      function linkLegalAuthorities(escapedText) {
        let out = escapedText;
        LEGAL_AUTHORITIES.forEach(auth => {
          const escapedMatch = escapeHtml(auth.match).replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
          const rx = new RegExp(`\\b(${escapedMatch})\\b`, 'g');
          out = out.replace(rx, `<button type="button" class="authority-link" data-auth-id="${auth.id}" title="Inspect legal authority">$1</button>`);
        });
        return out;
      }

      // =========================================================================
      // 3. SIMILARITY / PLAGIARISM PRE-CHECK ENGINE (3-WORD SHINGLES)
      // =========================================================================
      function tokenizeShingles(text) {
        const words = (text || '').toLowerCase().replace(/[^a-z0-9\s]/g, ' ').split(/\s+/).filter(Boolean);
        const set = new Set();
        for (let i = 0; i <= words.length - 3; i++) {
          set.add(words[i] + ' ' + words[i + 1] + ' ' + words[i + 2]);
        }
        return set;
      }

      function computeOriginalityReport(text, excludeId = null) {
        const target = tokenizeShingles(text);
        if (target.size === 0) return { originalityPct: 100, similarityPct: 0, matchedTitle: null };
        let maxOverlap = 0;
        let matchedTitle = null;

        const corpus = [
          ...state.articles.map(a => ({ id: a.id, title: a.title, text: a.abstract + ' ' + (a.sections || []).map(s => s.body).join(' ') })),
          ...state.submissions.map(s => ({ id: s.id, title: s.title, text: s.abstract + ' ' + (s.body || '') }))
        ];

        corpus.forEach(doc => {
          if (doc.id === excludeId) return;
          const docSet = tokenizeShingles(doc.text);
          if (docSet.size === 0) return;
          let hits = 0;
          target.forEach(sh => { if (docSet.has(sh)) hits++; });
          const ratio = hits / target.size;
          if (ratio > maxOverlap) {
            maxOverlap = ratio;
            matchedTitle = doc.title;
          }
        });

        const simPct = Math.round(maxOverlap * 1000) / 10;
        const origPct = Math.max(0, Math.round((100 - simPct) * 10) / 10);
        return { originalityPct: origPct, similarityPct: simPct, matchedTitle: simPct > 3 ? matchedTitle : null };
      }

      // =========================================================================
      // 4. INITIAL STATE & SAMPLE LEGAL SCHOLARSHIP
      // =========================================================================
      const DEFAULT_ARTICLES = [
        {
          id: 'art-101',
          title: 'Proportionality and Algorithmic Governance: Rethinking Administrative Law under the Digital Personal Data Protection Framework',
          type: 'Research Paper',
          category: 'Technology & Privacy',
          author: 'A. Sharma, LL.M.',
          affiliation: 'Senior Research Fellow, Centre for Law & Governance',
          volume: 'Vol. 4',
          issue: 'Issue 2',
          year: 2026,
          citationCode: '2026 ALN Vol. 4(2) 101',
          doi: '10.5555/aln.2026.42.101',
          publishedDate: '2026-10-18',
          status: 'Published',
          peerReviewed: true,
          featured: true,
          views: 1428,
          keywords: ['Administrative Law', 'Data Protection', 'Proportionality', 'Algorithmic Accountability'],
          abstract: 'Automated decision-making systems increasingly mediate access to welfare, credit, and regulatory compliance. This paper examines how classical principles of natural justice and the proportionality standard can be adapted to review opaque state algorithms within India’s statutory data protection framework.',
          sections: [
            {
              heading: 'I. Introduction',
              body: 'Public administration is undergoing a quiet structural shift from discretionary human adjudication to automated scoring and eligibility engines. While efficiency gains are substantial, algorithmic opacity creates friction with Article 14’s guarantee against arbitrariness and the duty to provide reasoned decisions.[1] Traditional judicial review presupposes an identifiable decision-maker capable of articulating contemporaneous reasons; automated systems rarely satisfy that baseline without statutory scaffolding.'
            },
            {
              heading: 'II. The Proportionality Test in Digital Governance',
              body: 'Following K.S. Puttaswamy and constitutional jurisprudence on informational privacy under Article 21, any state interference must satisfy legality, legitimate aim, suitability, necessity, and balancing.[2] When applied to automated processing under the Digital Personal Data Protection Act, 2023, the necessity prong requires demonstrating that less intrusive, explainable models were considered before deploying black-box classifiers in high-stakes public domains.'
            },
            {
              heading: 'III. Institutional Safeguards & Conclusion',
              body: 'To bridge the accountability gap, this paper proposes mandatory Algorithmic Impact Assessments (AIAs) for state data fiduciaries, statutory right-to-explanation disclosures, and an independent technical audit wing assisting adjudicatory bodies.[3] Embedding these safeguards preserves innovation while anchoring automated governance to constitutional discipline.'
            }
          ],
          footnotes: [
            'See generally M.P. Jain & S.N. Jain, Principles of Administrative Law (9th ed., LexisNexis) on reasoned decisions and audi alteram partem.',
            'K.S. Puttaswamy (Privacy-9J.) v. Union of India, (2017) 10 SCC 1 (establishing the four-fold proportionality framework).',
            'Digital Personal Data Protection Act, 2023, No. 22 of 2023, § 10 (obligations of Significant Data Fiduciaries).'
          ]
        },
        {
          id: 'art-102',
          title: 'Emergency Arbitrators and Seat-Centric Enforcement: Bridging Statutory Gaps in Commercial Dispute Resolution',
          type: 'Research Paper',
          category: 'Arbitration',
          author: 'R. Deshmukh, Advocate',
          affiliation: 'Commercial Litigation & Arbitration Practice',
          volume: 'Vol. 4',
          issue: 'Issue 2',
          year: 2026,
          citationCode: '2026 ALN Vol. 4(2) 144',
          doi: '10.5555/aln.2026.42.144',
          publishedDate: '2026-09-29',
          status: 'Published',
          peerReviewed: true,
          featured: false,
          views: 984,
          keywords: ['Emergency Arbitration', 'Interim Relief', 'Party Autonomy', 'Commercial Law'],
          abstract: 'Institutional arbitration rules worldwide recognize emergency arbitrators to grant urgent interim relief prior to tribunal constitution. This paper evaluates the enforceability of foreign-seated versus domestic-seated emergency awards and proposes targeted statutory amendments to eliminate procedural asymmetry.',
          sections: [
            {
              heading: 'I. The Commercial Imperative for Urgent Relief',
              body: 'In cross-border M&A and infrastructure disputes, asset dissipation can render a final arbitral award hollow before a three-member tribunal is even constituted. Emergency arbitration fills this interregnum by delivering binding interim measures within days while preserving confidentiality.[1]'
            },
            {
              heading: 'II. Domestic Recognition vs. Foreign-Seated Uncertainty',
              body: 'While judicial precedent has affirmed that India-seated emergency awards are enforceable under Section 17(2) of the Arbitration and Conciliation Act, 1996, parties with foreign-seated arbitrations still face indirect enforcement routes via Section 9.[2] Legislative codification defining "arbitral tribunal" to expressly include emergency arbitrators across Part I and Part II would align domestic practice with Singapore and Hong Kong.'
            }
          ],
          footnotes: [
            'SIAC Rules 2016, Schedule 1; MCIA Rules 2016, Rule 14 (Emergency Arbitrator procedures).',
            'Amazon.com NV Investment Holdings LLC v. Future Retail Ltd., (2022) 1 SCC 209.'
          ]
        },
        {
          id: 'art-103',
          title: 'Electronic Evidence and Chain-of-Custody Standards under the Bharatiya Sakshya Adhiniyam',
          type: 'Article',
          category: 'Criminal Law',
          author: 'M. Nair, Research Fellow',
          affiliation: 'Criminal Justice & Evidence Studies Group',
          volume: 'Vol. 4',
          issue: 'Issue 1',
          year: 2026,
          citationCode: '2026 ALN Vol. 4(1) 058',

      function updateScholarHeadMetadata(art) {
        document.querySelectorAll('meta[data-dynamic-scholar="true"], script[data-dynamic-scholar="true"]').forEach(el => el.remove());
        if (!art) {
          document.title = 'A Legal Note — Journal of Law & Legal Scholarship';
          return;
        }
        document.title = `${art.title} — A Legal Note`;
        const metaPairs = [
          ['citation_title', art.title],
          ['citation_author', art.author],
          ['citation_publication_date', art.publishedDate],
          ['citation_journal_title', 'A Legal Note'],
          ['citation_volume', (art.volume || '').replace(/[^0-9]/g, '') || '4'],
          ['citation_issue', (art.issue || '').replace(/[^0-9]/g, '') || '1'],
          ['citation_doi', art.doi],
          ['citation_keywords', (art.keywords || []).join('; ')],
          ['og:title', art.title],
          ['og:description', art.abstract],
          ['og:type', 'article']
        ];
        metaPairs.forEach(([name, content]) => {
          const m = document.createElement('meta');
          m.setAttribute(name.startsWith('og:') ? 'property' : 'name', name);
          m.setAttribute('content', content || '');
          m.setAttribute('data-dynamic-scholar', 'true');
          document.head.appendChild(m);
        });
        const ld = document.createElement('script');
        ld.type = 'application/ld+json';
        ld.setAttribute('data-dynamic-scholar', 'true');
        ld.textContent = JSON.stringify({
          '@context': 'https://schema.org',
          '@type': 'ScholarlyArticle',
          headline: art.title,
          author: { '@type': 'Person', name: art.author, affiliation: art.affiliation || 'A Legal Note' },
          datePublished: art.publishedDate,
          isPartOf: { '@type': 'Periodical', name: 'A Legal Note', issn: '2584-XXXX' },
          identifier: art.doi,
          abstract: art.abstract,
          keywords: (art.keywords || []).join(', ')
        });
        document.head.appendChild(ld);
      }

      function downloadTypesetPdf(art) {
        if (!window.jspdf || !window.jspdf.jsPDF) {
          showToast('Opening print dialog for PDF export…', 'info');
          window.print();
          return;
        }
        try {
          const { jsPDF } = window.jspdf;
          const doc = new jsPDF({ unit: 'pt', format: 'a4' });
          const margin = 56;
          const pageW = doc.internal.pageSize.getWidth();
          const pageH = doc.internal.pageSize.getHeight();
          const maxW = pageW - margin * 2;
          let y = 70;

          const addHeaderFooter = (pageNum) => {
            doc.setFont('times', 'italic');
            doc.setFontSize(9);
            doc.setTextColor(110, 110, 110);
            doc.text(`A LEGAL NOTE  |  ${art.citationCode}`, margin, 36);
            doc.text(`DOI: ${art.doi}`, pageW - margin, 36, { align: 'right' });
            doc.setDrawColor(210, 210, 210);
            doc.line(margin, 44, pageW - margin, 44);
            doc.text(`Page ${pageNum}`, pageW / 2, pageH - 30, { align: 'center' });
          };

          const ensureSpace = (needed) => {
            if (y + needed > pageH - 64) {
              doc.addPage();
              addHeaderFooter(doc.getNumberOfPages());
              y = 70;
            }
          };

          addHeaderFooter(1);

          // Category & Type
          doc.setFont('helvetica', 'bold');
          doc.setFontSize(8.5);
          doc.setTextColor(30, 58, 95);
          doc.text(`${art.type.toUpperCase()}  ·  ${art.category.toUpperCase()}`, margin, y);
          y += 18;

          // Title
          doc.setFont('times', 'bold');
          doc.setFontSize(17);
          doc.setTextColor(17, 24, 39);
          const titleLines = doc.splitTextToSize(art.title, maxW);
          doc.text(titleLines, margin, y);
          y += titleLines.length * 21 + 8;

          // Author
          doc.setFont('times', 'italic');
          doc.setFontSize(11);
          doc.setTextColor(65, 65, 65);
          doc.text(`${art.author} — ${art.affiliation || 'A Legal Note'}`, margin, y);
          y += 16;
          doc.setFont('helvetica', 'normal');
          doc.setFontSize(8.5);
          doc.text(`Published: ${formatDate(art.publishedDate)}   |   ${art.volume}, ${art.issue}`, margin, y);
          y += 22;

          // Abstract box
          doc.setFont('times', 'normal');
          doc.setFontSize(10);
          const absLines = doc.splitTextToSize('Abstract: ' + art.abstract, maxW - 20);
          const boxH = absLines.length * 14 + 20;
          doc.setFillColor(246, 248, 250);
          doc.setDrawColor(220, 226, 232);
          doc.rect(margin, y, maxW, boxH, 'FD');
          doc.setTextColor(40, 40, 40);
          doc.text(absLines, margin + 10, y + 16);
          y += boxH + 22;

          // Sections
          (art.sections || []).forEach(sec => {
            ensureSpace(44);
            doc.setFont('times', 'bold');
            doc.setFontSize(12.5);
            doc.setTextColor(17, 24, 39);
            doc.text(sec.heading, margin, y);
            y += 18;

            doc.setFont('times', 'normal');
            doc.setFontSize(11);
            doc.setTextColor(30, 30, 30);
            const paras = (sec.body || '').split(/\n+/).filter(Boolean);
            paras.forEach(p => {
              const lines = doc.splitTextToSize(p, maxW);
              lines.forEach(ln => {
                ensureSpace(16);
                doc.text(ln, margin, y);
                y += 15.5;
              });
              y += 8;
            });
          });

          // Footnotes
          if ((art.footnotes || []).length) {
            ensureSpace(46);
            y += 8;
            doc.setDrawColor(190, 190, 190);
            doc.line(margin, y, margin + 140, y);
            y += 16;
            doc.setFont('helvetica', 'bold');
            doc.setFontSize(9);
            doc.setTextColor(75, 85, 99);
            doc.text('FOOTNOTES & AUTHORITIES', margin, y);
            y += 14;
            doc.setFont('times', 'normal');
            doc.setFontSize(9.5);
            art.footnotes.forEach((fn, i) => {
              const lines = doc.splitTextToSize(`${i + 1}. ${fn}`, maxW);
              lines.forEach(ln => {
                ensureSpace(14);
                doc.text(ln, margin, y);
                y += 13;
              });
              y += 4;
            });
          }

          const safeSlug = art.id.replace(/[^a-zA-Z0-9_-]/g, '');
          doc.save(`A-Legal-Note-${safeSlug}.pdf`);
          showToast('Typeset PDF downloaded', 'success');
        } catch (err) {
          showToast('PDF generator fallback: opening print view', 'warning');
          window.print();
        }
      }

      function buildCitations(art) {

        const volNum = (art.volume || 'Vol. 4').replace(/[^0-9]/g, '') || '4';
        const issNum = (art.issue || 'Issue 1').replace(/[^0-9]/g, '') || '1';
        return {
          ILI: `${art.author}, "${art.title}", ${volNum}(${issNum}) A Legal Note (${yr}), ${art.citationCode}.`,
          Bluebook: `${art.author}, ${art.title}, ${volNum} A Legal Note ${art.citationCode.split(' ').pop() || '1'} (${yr}).`,
          OSCOLA: `${art.author}, '${art.title}' (${yr}) ${volNum}(${issNum}) A Legal Note, DOI: ${art.doi}.`,
          BibTeX: `@article{${art.id.replace(/[^a-zA-Z0-9]/g, '')},\n  author = {${art.author}},\n  title = {${art.title}},\n  journal = {A Legal Note},\n  volume = {${volNum}},\n  number = {${issNum}},\n  year = {${yr}},\n  doi = {${art.doi}}\n}`
        };
      }

      function openCommandPalette() {
        openModal(`
          <div class="space-y-3">
            <div class="flex items-center gap-2 pb-3 border-b border-subtle">
              <i data-lucide="search" class="w-4 h-4 text-secondary"></i>

          const term = (q || '').trim().toLowerCase();
          const artMatches = getPublishedArticles().filter(a => !term || a.title.toLowerCase().includes(term) || a.author.toLowerCase().includes(term) || a.category.toLowerCase().includes(term));
          const authMatches = LEGAL_AUTHORITIES.filter(au => !term || au.title.toLowerCase().includes(term) || au.summary.toLowerCase().includes(term));
          res.innerHTML = `
            ${artMatches.slice(0, 5).map(a => `
              <button type="button" class="cmd-art-item w-full text-left py-2.5 px-2 hover:bg-gray-100/60 flex items-center justify-between gap-3" data-id="${escapeHtml(a.id)}">
                <div>
                  <div class="font-medium">${escapeHtml(a.title)}</div>
                  <div class="text-[11px] text-secondary">${escapeHtml(a.author)} · ${escapeHtml(a.citationCode)}</div>
                </div>
                <span class="text-[10px] px-1.5 py-0.5 rounded border border-subtle shrink-0">Paper</span>
              </button>
            `).join('')}
            ${authMatches.slice(0, 4).map(au => `
              <button type="button" class="cmd-auth-item w-full text-left py-2.5 px-2 hover:bg-gray-100/60 flex items-center justify-between gap-3" data-auth="${escapeHtml(au.id)}">
                <div>
                  <div class="font-medium">${escapeHtml(au.title)}</div>
                  <div class="text-[11px] text-secondary">${escapeHtml(au.citation)}</div>
                </div>
                <span class="text-[10px] px-1.5 py-0.5 rounded bg-legal-50 text-legal-700 shrink-0">Authority</span>
              </button>
            `).join('')}
            ${artMatches.length === 0 && authMatches.length === 0 ? `<div class="py-6 text-center text-secondary">No matching papers or authorities.</div>` : ''}

          res.querySelectorAll('.cmd-art-item').forEach(b => b.addEventListener('click', () => { closeModal(); navigate('reader', { articleId: b.getAttribute('data-id') }); }));
          res.querySelectorAll('.cmd-auth-item').forEach(b => b.addEventListener('click', () => openAuthorityModal(b.getAttribute('data-auth'))));
        };
        renderCmd('');
        inp.addEventListener('input', (e) => renderCmd(e.target.value));
        setTimeout(() => inp.focus(), 30);
      }

      function openDecisionEmailModal(sub) {

      // =========================================================================
      // 9. THEME, SPEECH & NAVIGATION
      // =========================================================================
      function stopSpeech() {
        try {
          if (window.speechSynthesis) window.speechSynthesis.cancel();
        } catch (e) { /* ignore */ }
        state.isSpeaking = false;
      }

      function toggleSpeechForArticle(art) {
        if (!window.speechSynthesis) {
          showToast('Audio reader unavailable in this browser', 'warning');
          return;
        }
        if (state.isSpeaking) {
          stopSpeech();
          render();
          return;
        }
        const text = `${art.title}. By ${art.author}. Abstract. ${art.abstract}. ` +
          (art.sections || []).map(s => `${s.heading}. ${s.body}`).join(' ');
        const utt = new SpeechSynthesisUtterance(text);
        utt.rate = 1.0;
        utt.onend = () => { state.isSpeaking = false; render(); };
        utt.onerror = () => { state.isSpeaking = false; render(); };
        window.speechSynthesis.cancel();
        window.speechSynthesis.speak(utt);
        state.isSpeaking = true;
        render();
      }

      function applyTheme() {
        document.body.classList.remove('theme-sepia', 'theme-dark');
        if (state.theme === 'sepia') document.body.classList.add('theme-sepia');
        if (state.theme === 'dark') document.body.classList.add('theme-dark');
        const btn = document.getElementById('theme-cycle-btn');
        if (btn) {
          const iconName = state.theme === 'dark' ? 'moon' : state.theme === 'sepia' ? 'book-open' : 'sun';
          btn.innerHTML = `<i data-lucide="${iconName}" class="w-4 h-4"></i>`;
        }
      }

      function updateNavUI() {
        document.querySelectorAll('.nav-btn, .mobile-nav-btn').forEach(btn => {
          const target = btn.getAttribute('data-nav');
          const active = (state.view === target) || (state.view === 'reader' && target === 'journal');
          btn.classList.toggle('bg-legal-50', active && state.theme !== 'dark');
          btn.classList.toggle('text-legal-700', active && state.theme !== 'dark');
          btn.classList.toggle('font-semibold', active);
        });
        const countEl = document.getElementById('nav-saved-count');
        const mCountEl = document.getElementById('mobile-saved-count');
        if (countEl) countEl.textContent = state.savedIds.length;
        if (mCountEl) mCountEl.textContent = state.savedIds.length;

        const adminLabel = document.getElementById('admin-nav-label');
        if (adminLabel) {
          adminLabel.textContent = state.session.authenticated ? 'Admin · Active' : 'Admin';
        }
        const progressWrap = document.getElementById('reading-progress-wrap');
        if (progressWrap) {
          progressWrap.classList.toggle('hidden', state.view !== 'reader');
        }
      }

      function navigate(view, opts = {}) {
        stopSpeech();
        state.view = view;
        if (opts.articleId) {
          state.selectedArticleId = opts.articleId;
          const art = state.articles.find(a => a.id === opts.articleId);
          if (art) {
            art.views = (art.views || 0) + 1;
            updateScholarHeadMetadata(art);
            persistState();
          }
        } else {
          updateScholarHeadMetadata(null);
        }
        document.getElementById('mobile-nav').classList.add('hidden');
        window.scrollTo({ top: 0, behavior: 'smooth' });
        render();
      }

      function toggleSaved(articleId) {
        const idx = state.savedIds.indexOf(articleId);
        if (idx >= 0) {
          state.savedIds.splice(idx, 1);
          showToast('Removed from reading list', 'info');
        } else {
          state.savedIds.push(articleId);
          showToast('Saved to reading list', 'success');
        }
        persistState();
        render();
      }

      function getPublishedArticles() {
        return state.articles.filter(a => a.status === 'Published');
      }

      // =========================================================================
      // 10. VIEW RENDERERS
      // =========================================================================
      function renderJournalView() {
        const published = getPublishedArticles();
        const featured = published.find(a => a.featured) || published[0];

        const q = state.searchQuery.trim().toLowerCase();
        let filtered = published.filter(a => {
          const catOk = state.categoryFilter === 'All' || a.category === state.categoryFilter;
          if (!catOk) return false;
          if (!q) return true;
          return (
            a.title.toLowerCase().includes(q) ||
            a.author.toLowerCase().includes(q) ||
            a.abstract.toLowerCase().includes(q) ||
            a.citationCode.toLowerCase().includes(q) ||
            (a.keywords || []).some(k => k.toLowerCase().includes(q))
          );
        });

        if (state.sortBy === 'newest') {
          filtered.sort((a, b) => new Date(b.publishedDate) - new Date(a.publishedDate));
        } else if (state.sortBy === 'popular') {
          filtered.sort((a, b) => (b.views || 0) - (a.views || 0));
        } else if (state.sortBy === 'papers') {
          filtered = filtered.filter(a => a.type === 'Research Paper');
        } else if (state.sortBy === 'articles') {
          filtered = filtered.filter(a => a.type !== 'Research Paper');
        }

        const isFiltering = q.length > 0 || state.categoryFilter !== 'All' || state.sortBy !== 'newest';

        return `
          <section class="pb-8 border-b border-subtle">
            <div class="max-w-3xl">

                Rigorous legal commentary, peer-reviewed papers, and statutory analysis.

              <p class="text-sm text-secondary mt-3 leading-relaxed">

                  <span class="px-2 py-0.5 rounded bg-legal-800 text-white font-medium">Featured Paper</span>
                  <span class="px-2 py-0.5 rounded border border-subtle font-medium">${escapeHtml(featured.category)}</span>
                  <span class="text-secondary font-mono">${escapeHtml(featured.citationCode)}</span>
                  ${featured.peerReviewed ? `<span class="text-emerald-700 font-medium flex items-center gap-1"><i data-lucide="check-circle-2" class="w-3.5 h-3.5"></i> Peer-Reviewed</span>` : ''}
                </div>
                <button type="button" class="open-article-btn text-left block group" data-id="${escapeHtml(featured.id)}">
                  <h2 class="font-serif text-2xl sm:text-3xl font-medium leading-snug group-hover:text-legal-700 transition-colors">
                    ${escapeHtml(featured.title)}
                  </h2>
                </button>
                <p class="text-sm text-secondary mt-3 leading-relaxed max-w-4xl">
                  ${escapeHtml(featured.abstract)}
                </p>
                <div class="mt-5 flex flex-wrap items-center justify-between gap-4 pt-4 border-t border-subtle">
                  <div class="text-xs text-secondary">
                    <span class="font-medium text-current">${escapeHtml(featured.author)}</span>
                    <span class="mx-1.5">·</span>
                    <span>${formatDate(featured.publishedDate)}</span>
                    <span class="mx-1.5">·</span>
                    <span>${estimateReadTime((featured.sections || []).map(s => s.body).join(' '))}</span>
                  </div>
                  <div class="flex items-center gap-2">

                    </button>

                </div>
              </div>
            </section>
          ` : ''}

          <section class="pt-8 pb-6 space-y-4">
            <div class="flex flex-col sm:flex-row gap-3">
              <div class="relative flex-1">
                <i data-lucide="search" class="w-4 h-4 text-secondary absolute left-3.5 top-1/2 -translate-y-1/2 pointer-events-none"></i>
                <input
                  id="journal-search-input"

                  placeholder="Search by title, author, keyword, or citation..."

                />

            <div class="flex items-center gap-2 overflow-x-auto no-scrollbar pb-1">

                    <span>${escapeHtml(art.category)}</span>
                    <span>·</span>
                    <span class="font-mono text-[11px]">${escapeHtml(art.citationCode)}</span>

      function renderArchivesView() {
        const published = getPublishedArticles();
        const groups = {};
        published.forEach(art => {

          groups[key].push(art);
        });

        return `

                            ${escapeHtml(art.title)}

                            ${escapeHtml(art.author)} · <span class="font-mono">${escapeHtml(art.citationCode)}</span>

      function renderAdminCharts() {
        activeCharts.forEach(c => { try { c.destroy(); } catch (e) { /* ignore */ } });
        activeCharts = [];
        if (state.view !== 'admin' || !state.session.authenticated || state.adminTab !== 'analytics' || !window.Chart) return;

        const c1 = document.getElementById('chart-reads-cat');
        const c2 = document.getElementById('chart-pipeline');
        if (c1) {
          const cats = CATEGORIES.filter(c => c !== 'All');
          const totals = cats.map(cat => state.articles.filter(a => a.category === cat).reduce((s, a) => s + (a.views || 0), 0));
          activeCharts.push(new Chart(c1, {
            type: 'bar',
            data: {
              labels: cats.map(c => c.split(' ')[0]),
              datasets: [{ label: 'Reads', data: totals, backgroundColor: '#1E3A5F', borderRadius: 4 }]
            },
            options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true } } }
          }));
        }
        if (c2) {
          const stages = ['Published', 'Initial Screening', 'Peer Review', 'Revisions Requested', 'Accepted'];
          const counts = [
            state.articles.filter(a => a.status === 'Published').length,
            state.submissions.filter(s => s.status === 'Initial Screening').length,
            state.submissions.filter(s => s.status === 'Peer Review').length,
            state.submissions.filter(s => s.status === 'Revisions Requested').length,
            state.submissions.filter(s => s.status === 'Accepted').length
          ];
          activeCharts.push(new Chart(c2, {
            type: 'doughnut',
            data: {
              labels: stages,
              datasets: [{ data: counts, backgroundColor: ['#162C49', '#64748B', '#1E3A5F', '#D97706', '#059669'] }]
            },
            options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'bottom', labels: { boxWidth: 10, font: { size: 11 } } } } }
          }));
        }
      }

      function openArticleEditorModal(articleId = null) {

          <form id="article-editor-form" class="space-y-4 text-xs">

              <label class="block font-semibold uppercase tracking-wider text-secondary mb-1">Title *</label>
              <input id="ed-title" required type="text" value="${escapeHtml(existing ? existing.title : '')}" class="w-full px-3 py-2 text-sm rounded-lg border border-subtle surface" />
            </div>
            <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">

                </select>
              </div>
              <div>
                <label class="block font-semibold uppercase tracking-wider text-secondary mb-1">Category</label>
                <select id="ed-category" class="w-full px-3 py-2 rounded-lg border border-subtle surface">
                  ${CATEGORIES.filter(c => c !== 'All').map(c => `<option value="${c}" ${existing && existing.category === c ? 'selected' : ''}>${c}</option>`).join('')}

              </div>
              <div>
                <label class="block font-semibold uppercase tracking-wider text-secondary mb-1">Status</label>
                <select id="ed-status" class="w-full px-3 py-2 rounded-lg border border-subtle surface">
                  ${['Published', 'Draft', 'Archived'].map(s => `<option value="${s}" ${existing && existing.status === s ? 'selected' : ''}>${s}</option>`).join('')}

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">

                <label class="block font-semibold uppercase tracking-wider text-secondary mb-1">Author *</label>
                <input id="ed-author" required type="text" value="${escapeHtml(existing ? existing.author : '')}" class="w-full px-3 py-2 rounded-lg border border-subtle surface" />
              </div>
              <div>
                <label class="block font-semibold uppercase tracking-wider text-secondary mb-1">Affiliation</label>
                <input id="ed-affiliation" type="text" value="${escapeHtml(existing ? existing.affiliation : '')}" class="w-full px-3 py-2 rounded-lg border border-subtle surface" />
              </div>
            </div>
            <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
              <div>
                <label class="block font-semibold uppercase tracking-wider text-secondary mb-1">Volume</label>
                <input id="ed-volume" type="text" value="${escapeHtml(existing ? existing.volume : 'Vol. 4')}" class="w-full px-3 py-2 rounded-lg border border-subtle surface" />
              </div>
              <div>

              <label class="block font-semibold uppercase tracking-wider text-secondary mb-1">Body (Separate sections with blank lines; first line = heading) *</label>

            </div>
            <div>
              <label class="block font-semibold uppercase tracking-wider text-secondary mb-1">Footnotes (One per line)</label>

                <input id="ed-featured" type="checkbox" ${existing && existing.featured ? 'checked' : ''} />

              </label>
            </div>

              <button type="button" id="ed-cancel-btn" class="px-4 py-2 rounded-lg border border-subtle font-medium">Cancel</button>

        document.getElementById('modal-close-btn').addEventListener('click', closeModal);
        document.getElementById('ed-cancel-btn').addEventListener('click', closeModal);
        document.getElementById('article-editor-form').addEventListener('submit', (e) => {
          e.preventDefault();
          const rawBlocks = document.getElementById('ed-body').value.trim().split(/\n\s*\n/).filter(Boolean);
          const sections = rawBlocks.map((block, i) => {
            const lines = block.split('\n');
            if (lines.length > 1) return { heading: lines[0].trim(), body: lines.slice(1).join('\n').trim() };
            return { heading: i === 0 ? 'I. Overview' : `Section ${i + 1}`, body: block.trim() };
          });
          const footnotes = document.getElementById('ed-footnotes').value.split('\n').map(s => s.trim()).filter(Boolean);
          const isFeatured = document.getElementById('ed-featured').checked;
          if (isFeatured) state.articles.forEach(a => { a.featured = false; });

          const payload = {
            title: document.getElementById('ed-title').value.trim(),
            type: document.getElementById('ed-type').value,
            category: document.getElementById('ed-category').value,
            status: document.getElementById('ed-status').value,
            author: document.getElementById('ed-author').value.trim(),
            affiliation: document.getElementById('ed-affiliation').value.trim(),
            volume: document.getElementById('ed-volume').value.trim() || 'Vol. 4',
            issue: document.getElementById('ed-issue').value.trim() || 'Issue 2',
            citationCode: document.getElementById('ed-citation').value.trim(),
            abstract: document.getElementById('ed-abstract').value.trim(),
            sections: sections.length ? sections : [{ heading: 'I. Text', body: '' }],
            footnotes,
            peerReviewed: document.getElementById('ed-peer').checked,
            featured: isFeatured
          };

          if (existing) {
            Object.assign(existing, payload);
            addAudit(state.session.user.email, state.session.user.role, `Updated publication "${payload.title.slice(0, 45)}"`, 'info');
            showToast('Publication updated', 'success');
          } else {
            const newId = 'art-' + Date.now().toString().slice(-5);
            state.articles.unshift({
              id: newId,
              year: new Date().getFullYear(),
              doi: `10.5555/aln.${new Date().getFullYear()}.${newId}`,
              publishedDate: new Date().toISOString().slice(0, 10),
              views: 0,
              keywords: [payload.category, payload.type],
              ...payload
            });
            addAudit(state.session.user.email, state.session.user.role, `Created new ${payload.status} "${payload.title.slice(0, 45)}"`, 'success');
            showToast('Publication saved', 'success');
          }
          persistState();
          closeModal();
          render();
        });
      }

      // =========================================================================
      // 13. EVENT BINDING & RENDER LOOP
      // =========================================================================
      function bindViewEvents() {
        document.querySelectorAll('.open-article-btn').forEach(btn => {
          btn.addEventListener('click', () => navigate('reader', { articleId: btn.getAttribute('data-id') }));
        });
        document.querySelectorAll('.cite-btn').forEach(btn => {
          btn.addEventListener('click', () => openCitationModal(btn.getAttribute('data-id')));
        });
        document.querySelectorAll('.save-btn').forEach(btn => {
          btn.addEventListener('click', () => toggleSaved(btn.getAttribute('data-id')));
        });
        document.querySelectorAll('.nav-inline-btn').forEach(btn => {
          btn.addEventListener('click', () => navigate(btn.getAttribute('data-nav')));
        });
        document.querySelectorAll('.authority-link').forEach(btn => {
          btn.addEventListener('click', () => openAuthorityModal(btn.getAttribute('data-auth-id')));
        });

        // Journal search & filters
        const searchInput = document.getElementById('journal-search-input');
        if (searchInput) {
          searchInput.addEventListener('input', (e) => {
            state.searchQuery = e.target.value;
            render();
            const el = document.getElementById('journal-search-input');
            if (el) { el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
          });
        }
        const sortSelect = document.getElementById('journal-sort-select');
        if (sortSelect) sortSelect.addEventListener('change', (e) => { state.sortBy = e.target.value; render(); });
        document.querySelectorAll('.cat-pill').forEach(btn => {
          btn.addEventListener('click', () => { state.categoryFilter = btn.getAttribute('data-cat'); render(); });
        });
        const clearBtn = document.getElementById('clear-filters-btn');
        if (clearBtn) clearBtn.addEventListener('click', () => { state.searchQuery = ''; state.categoryFilter = 'All'; state.sortBy = 'newest'; render(); });

        // Archives RSS
        const archRss = document.getElementById('archive-rss-btn');
        if (archRss) archRss.addEventListener('click', () => { downloadFile('a-legal-note-rss.xml', generateRssXml(), 'application/rss+xml'); showToast('RSS feed downloaded', 'success'); });

        // Reader controls
        const backBtn = document.getElementById('back-to-journal-btn');
        if (backBtn) backBtn.addEventListener('click', () => navigate('journal'));
        const decBtn = document.getElementById('font-dec-btn');
        if (decBtn) decBtn.addEventListener('click', () => { state.readerFontSize = Math.max(14, state.readerFontSize - 1); render(); });
        const incBtn = document.getElementById('font-inc-btn');
        if (incBtn) incBtn.addEventListener('click', () => { state.readerFontSize = Math.min(22, state.readerFontSize + 1); render(); });
        const printBtn = document.getElementById('print-paper-btn');
        if (printBtn) printBtn.addEventListener('click', () => window.print());
        const pdfBtn = document.getElementById('download-pdf-btn');
        if (pdfBtn) {
          pdfBtn.addEventListener('click', () => {
            const art = state.articles.find(a => a.id === state.selectedArticleId);
            if (art) downloadTypesetPdf(art);
          });
        }
        const listenBtn = document.getElementById('listen-paper-btn');
        if (listenBtn) {
          listenBtn.addEventListener('click', () => {
            const art = state.articles.find(a => a.id === state.selectedArticleId);
            if (art) toggleSpeechForArticle(art);
          });
        }

        // Private reader notes
        const noteForm = document.getElementById('add-reader-note-form');
        if (noteForm) {
          noteForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const inp = document.getElementById('reader-note-input');
            const text = inp.value.trim();
            if (!text || !state.selectedArticleId) return;
            if (!state.readerNotes[state.selectedArticleId]) state.readerNotes[state.selectedArticleId] = [];
            state.readerNotes[state.selectedArticleId].unshift({ id: generateId('NOTE'), text, date: formatDate(new Date().toISOString()) });
            persistState();
            showToast('Study note saved', 'success');
            render();
          });
        }
        document.querySelectorAll('.del-reader-note-btn').forEach(btn => {
          btn.addEventListener('click', () => {
            const nid = btn.getAttribute('data-note-id');
            if (!state.selectedArticleId || !state.readerNotes[state.selectedArticleId]) return;
            state.readerNotes[state.selectedArticleId] = state.readerNotes[state.selectedArticleId].filter(n => n.id !== nid);
            persistState();
            render();
          });
        });
        const exportNotesBtn = document.getElementById('export-notes-btn');
        if (exportNotesBtn) {
          exportNotesBtn.addEventListener('click', () => {
            const art = state.articles.find(a => a.id === state.selectedArticleId);
            const notes = state.readerNotes[state.selectedArticleId] || [];
            const txt = `A Legal Note — Study Notes\nPaper: ${art.title}\nCitation: ${art.citationCode}\n\n` + notes.map((n, i) => `${i + 1}. [${n.date}] ${n.text}`).join('\n');
            downloadFile(`notes-${art.id}.txt`, txt, 'text/plain');
            showToast('Notes exported', 'success');
          });
        }

        // Submit form word counter, file upload & originality check
        const subBody = document.getElementById('sub-body');
        const subWordCount = document.getElementById('sub-word-count');
        if (subBody && subWordCount) {
          subBody.addEventListener('input', () => { subWordCount.textContent = countWords(subBody.value) + ' words'; });
        }
        const subFile = document.getElementById('sub-file-input');
        if (subFile) {
          subFile.addEventListener('change', (e) => {
            const f = e.target.files[0];
            if (!f) return;
            state.pendingAttachmentName = f.name;
            const lbl = document.getElementById('sub-file-label');
            if (lbl) lbl.textContent = 'Attached: ' + f.name;
            if (f.name.endsWith('.txt') || f.name.endsWith('.md')) {
              const r = new FileReader();
              r.onload = () => {
                if (subBody) {
                  subBody.value = String(r.result || '');
                  if (subWordCount) subWordCount.textContent = countWords(subBody.value) + ' words';
                }
                showToast('Text imported from ' + f.name, 'success');
              };
              r.readAsText(f);
            } else {
              showToast(`Attached ${f.name}`, 'info');
            }
          });
        }
        const simBtn = document.getElementById('run-similarity-btn');
        if (simBtn) {
          simBtn.addEventListener('click', () => {
            const abs = document.getElementById('sub-abstract')?.value || '';
            const bod = document.getElementById('sub-body')?.value || '';
            const rep = computeOriginalityReport(abs + ' ' + bod);
            const out = document.getElementById('similarity-check-output');
            if (out) {
              out.innerHTML = `<span class="font-semibold ${rep.originalityPct >= 85 ? 'text-emerald-700' : 'text-amber-700'}">Originality Score: ${rep.originalityPct}%</span> (${rep.similarityPct}% overlap${rep.matchedTitle ? ` with "${escapeHtml(rep.matchedTitle.slice(0, 42))}..."` : ' with journal archives'})`;
            }
          });
        }

        const subForm = document.getElementById('manuscript-submit-form');
        if (subForm) {
          subForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const newId = 'ALN-2026-' + Math.floor(1000 + Math.random() * 9000);
            const abs = document.getElementById('sub-abstract').value.trim();
            const bod = document.getElementById('sub-body').value.trim();
            const rep = computeOriginalityReport(abs + ' ' + bod);
            const newSub = {
              id: newId,
              title: document.getElementById('sub-title').value.trim(),
              type: document.getElementById('sub-type').value,
              category: document.getElementById('sub-category').value,
              author: document.getElementById('sub-author').value.trim(),
              email: document.getElementById('sub-email').value.trim(),
              affiliation: document.getElementById('sub-affiliation').value.trim(),
              keywords: document.getElementById('sub-keywords').value.split(',').map(k => k.trim()).filter(Boolean),
              abstract: abs,
              body: bod,
              attachmentName: state.pendingAttachmentName,
              originalityPct: rep.originalityPct,
              submittedDate: new Date().toISOString().slice(0, 10),
              status: 'Initial Screening',
              reviewerNotes: ''
            };
            state.submissions.unshift(newSub);
            state.pendingAttachmentName = '';
            state.trackerResult = newSub;
            addAudit(newSub.email, 'Author', `Submitted manuscript ${newId} (${rep.originalityPct}% original)`, 'info');
            persistState();
            showToast(`Manuscript submitted! Tracking ID: ${newId}`, 'success');
            render();
          });
        }

        // Tracker
        const trackForm = document.getElementById('track-status-form');
        if (trackForm) {
          trackForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const q = document.getElementById('track-id-input').value.trim().toUpperCase();
            if (!q) return;
            const found = state.submissions.find(s => s.id.toUpperCase() === q);
            state.trackerResult = found || { notFound: true, query: q };
            render();
          });
        }
        document.querySelectorAll('.sample-track-btn').forEach(btn => {
          btn.addEventListener('click', () => {
            const id = btn.getAttribute('data-track');
            state.trackerResult = state.submissions.find(s => s.id === id) || { notFound: true, query: id };
            render();
          });
        });

        // Admin Login
        document.querySelectorAll('.demo-cred-btn').forEach(btn => {
          btn.addEventListener('click', () => {
            const em = document.getElementById('login-email');
            const pw = document.getElementById('login-password');
            if (em && pw) { em.value = btn.getAttribute('data-email'); pw.value = btn.getAttribute('data-pass'); }
          });
        });

        const loginForm = document.getElementById('admin-login-form');
        if (loginForm) {
          loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            if (state.session.lockedUntil > Date.now()) return;
            const email = document.getElementById('login-email').value.trim().toLowerCase();
            const pass = document.getElementById('login-password').value;
            const user = state.staff.find(u => u.email.toLowerCase() === email && u.active);
            const enteredHash = await hashPassword(pass);
            const expectedHash = user ? await hashPassword(user.passPlain) : '';

            if (!user || enteredHash !== expectedHash) {
              state.session.failedAttempts += 1;
              addAudit(email || 'unknown', 'Anonymous', `Failed admin login attempt (${state.session.failedAttempts}/${state.security.maxLoginAttempts})`, 'error');
              if (state.session.failedAttempts >= state.security.maxLoginAttempts) {
                state.session.lockedUntil = Date.now() + 30000;
                state.session.failedAttempts = 0;
                addAudit(email || 'unknown', 'Security', 'Triggered 30s brute-force lockout', 'warning');
                showToast('Too many failed attempts. Locked for 30s.', 'error');
                startLockoutTicker();
              } else {
                showToast('Invalid credentials or suspended account.', 'error');
              }
              render();
              return;
            }

            state.session.failedAttempts = 0;
            if (state.security.require2FA) {
              state.session.pending2FAUser = user;
              state.session.active2FACode = String(Math.floor(100000 + Math.random() * 900000));
              render();
            } else {
              completeAdminLogin(user);
            }
          });
        }

        const twoFAForm = document.getElementById('admin-2fa-form');
        if (twoFAForm) {
          twoFAForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const code = document.getElementById('totp-input').value.trim();
            if (code === state.session.active2FACode) {
              completeAdminLogin(state.session.pending2FAUser);
            } else {
              addAudit(state.session.pending2FAUser.email, 'Security', 'Invalid 2FA verification code entered', 'warning');
              showToast('Incorrect 6-digit code.', 'error');
            }
          });
        }
        const cancel2FA = document.getElementById('cancel-2fa-btn');
        if (cancel2FA) cancel2FA.addEventListener('click', () => { state.session.pending2FAUser = null; state.session.active2FACode = null; render(); });

        // Admin Authenticated Actions
        const logoutBtn = document.getElementById('admin-logout-btn');
        if (logoutBtn) {
          logoutBtn.addEventListener('click', () => {
            if (state.session.user) addAudit(state.session.user.email, state.session.user.role, 'Signed out of Admin Panel', 'info');
            state.session.authenticated = false;
            state.session.user = null;
            clearInterval(sessionTimerInterval);
            showToast('Admin session locked', 'info');
            render();
          });
        }

        document.querySelectorAll('.admin-tab-btn').forEach(btn => {
          btn.addEventListener('click', () => { state.adminTab = btn.getAttribute('data-admin-tab'); touchAdminSession(); render(); });
        });

        const newArtBtn = document.getElementById('new-article-btn');
        if (newArtBtn) newArtBtn.addEventListener('click', () => { touchAdminSession(); openArticleEditorModal(null); });

        document.querySelectorAll('.edit-article-btn').forEach(btn => {
          btn.addEventListener('click', () => { touchAdminSession(); openArticleEditorModal(btn.getAttribute('data-id')); });
        });

        document.querySelectorAll('.toggle-pub-btn').forEach(btn => {
          btn.addEventListener('click', () => {
            touchAdminSession();
            const art = state.articles.find(a => a.id === btn.getAttribute('data-id'));
            if (!art) return;
            art.status = art.status === 'Published' ? 'Draft' : 'Published';
            addAudit(state.session.user.email, state.session.user.role, `Changed "${art.title.slice(0, 35)}" to ${art.status}`, 'info');
            persistState();
            showToast(`Status updated to ${art.status}`, 'success');
            render();
          });
        });

        document.querySelectorAll('.delete-article-btn').forEach(btn => {
          btn.addEventListener('click', () => {
            touchAdminSession();
            const id = btn.getAttribute('data-id');
            const art = state.articles.find(a => a.id === id);
            if (!art) return;
            openConfirmModal('Delete Publication?', `This will permanently remove "${art.title}" from the journal.`, 'Delete Permanently', () => {
              state.articles = state.articles.filter(a => a.id !== id);
              addAudit(state.session.user.email, state.session.user.role, `Deleted publication ${id}`, 'warning');
              persistState();
              showToast('Publication deleted', 'info');
              render();
            });
          });
        });

        // Submissions Queue
        const blindToggle = document.getElementById('blind-mode-toggle');
        if (blindToggle) blindToggle.addEventListener('change', (e) => { state.blindReviewMode = e.target.checked; render(); });

        document.querySelectorAll('.sub-status-select').forEach(sel => {
          sel.addEventListener('change', (e) => {
            touchAdminSession();
            const sub = state.submissions.find(s => s.id === sel.getAttribute('data-sub-id'));
            if (!sub) return;
            sub.status = e.target.value;
            addAudit(state.session.user.email, state.session.user.role, `Updated manuscript ${sub.id} to ${sub.status}`, 'info');
            persistState();
            showToast(`${sub.id} marked as ${sub.status}`, 'success');
            render();
          });
        });

        document.querySelectorAll('.notify-author-btn').forEach(btn => {
          btn.addEventListener('click', () => {
            const sub = state.submissions.find(s => s.id === btn.getAttribute('data-sub-id'));
            if (sub) openDecisionEmailModal(sub);
          });
        });

        document.querySelectorAll('.save-sub-note-btn').forEach(btn => {
          btn.addEventListener('click', () => {
            touchAdminSession();
            const id = btn.getAttribute('data-sub-id');
            const sub = state.submissions.find(s => s.id === id);
            const inp = document.querySelector(`.sub-note-input[data-sub-id="${id}"]`);
            if (!sub || !inp) return;
            sub.reviewerNotes = inp.value.trim();
            addAudit(state.session.user.email, state.session.user.role, `Saved review note on ${id}`, 'info');
            persistState();
            showToast('Reviewer note saved', 'success');
          });
        });

        document.querySelectorAll('.promote-sub-btn').forEach(btn => {
          btn.addEventListener('click', () => {
            touchAdminSession();
            const id = btn.getAttribute('data-sub-id');
            const sub = state.submissions.find(s => s.id === id);
            if (!sub) return;
            const rawBlocks = (sub.body || '').trim().split(/\n\s*\n/).filter(Boolean);
            const sections = rawBlocks.map((b, i) => {
              const lines = b.split('\n');
              return lines.length > 1
                ? { heading: lines[0].trim(), body: lines.slice(1).join('\n').trim() }
                : { heading: i === 0 ? 'I. Introduction' : `Section ${i + 1}`, body: b.trim() };
            });
            const newArtId = 'art-' + Date.now().toString().slice(-5);
            const pageNum = Math.floor(250 + Math.random() * 500);
            state.articles.unshift({
              id: newArtId,
              title: sub.title,
              type: sub.type,
              category: sub.category,
              author: sub.author,
              affiliation: sub.affiliation || 'Contributor',
              volume: 'Vol. 4',
              issue: 'Issue 2',
              year: 2026,
              citationCode: `2026 ALN Vol. 4(2) ${pageNum}`,
              doi: `10.5555/aln.2026.42.${pageNum}`,
              publishedDate: new Date().toISOString().slice(0, 10),
              status: 'Published',
              peerReviewed: true,
              featured: false,
              views: 0,
              keywords: sub.keywords || [sub.category],
              abstract: sub.abstract,
              sections,
              footnotes: []
            });
            sub.status = 'Published';
            addAudit(state.session.user.email, state.session.user.role, `Promoted manuscript ${sub.id} to live journal`, 'success');
            persistState();
            showToast(`Published "${sub.title.slice(0, 32)}..." live!`, 'success');
            render();
          });
        });

        // Security, RBAC & Backend Controls
        const sec2fa = document.getElementById('sec-2fa-toggle');
        if (sec2fa) sec2fa.addEventListener('change', (e) => { state.security.require2FA = e.target.checked; addAudit(state.session.user.email, state.session.user.role, `Set 2FA enforcement to ${e.target.checked}`, 'warning'); persistState(); showToast('2FA policy updated', 'success'); });
        const secSubs = document.getElementById('sec-subs-toggle');
        if (secSubs) secSubs.addEventListener('change', (e) => { state.security.submissionsOpen = e.target.checked; addAudit(state.session.user.email, state.session.user.role, `Public submissions ${e.target.checked ? 'opened' : 'paused'}`, 'info'); persistState(); showToast('Submission portal updated', 'success'); });
        const secTimeout = document.getElementById('sec-timeout-select');
        if (secTimeout) secTimeout.addEventListener('change', (e) => { state.security.sessionTimeoutMinutes = Number(e.target.value); touchAdminSession(); addAudit(state.session.user.email, state.session.user.role, `Session timeout set to ${e.target.value} min`, 'info'); persistState(); render(); });

        document.querySelectorAll('.toggle-staff-btn').forEach(btn => {
          btn.addEventListener('click', () => {
            const st = state.staff.find(u => u.id === btn.getAttribute('data-staff-id'));
            if (!st) return;
            st.active = !st.active;
            addAudit(state.session.user.email, state.session.user.role, `${st.active ? 'Restored' : 'Suspended'} staff account ${st.email}`, 'warning');
            persistState();
            showToast(`${st.email} ${st.active ? 'restored' : 'suspended'}`, 'info');
            render();
          });
        });

        const addStaffForm = document.getElementById('add-staff-form');
        if (addStaffForm) {
          addStaffForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const email = document.getElementById('staff-email-inp').value.trim().toLowerCase();
            const role = document.getElementById('staff-role-inp').value;
            if (state.staff.some(u => u.email.toLowerCase() === email)) {
              showToast('Email already exists', 'error');
              return;
            }
            const tempPass = 'ALN@' + Math.floor(1000 + Math.random() * 9000);
            state.staff.push({ id: generateId('USR'), name: role, email, role, passPlain: tempPass, active: true });
            addAudit(state.session.user.email, state.session.user.role, `Added ${role} (${email})`, 'success');
            persistState();
            showToast(`Added ${email} (Temp password: ${tempPass})`, 'success');
            render();
          });
        }

        const exportBtn = document.getElementById('export-json-btn');
        if (exportBtn) {
          exportBtn.addEventListener('click', () => {
            downloadFile(`a-legal-note-backup-${new Date().toISOString().slice(0, 10)}.json`, JSON.stringify({ articles: state.articles, submissions: state.submissions, security: state.security, staff: state.staff }, null, 2), 'application/json');
            addAudit(state.session.user.email, state.session.user.role, 'Exported JSON database backup', 'info');
            showToast('Backup exported as JSON', 'success');
          });
        }

        const importInput = document.getElementById('import-json-input');
        if (importInput) {
          importInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = () => {
              try {
                const parsed = JSON.parse(reader.result);
                if (Array.isArray(parsed.articles)) state.articles = parsed.articles;
                if (Array.isArray(parsed.submissions)) state.submissions = parsed.submissions;
                if (parsed.security) state.security = { ...DEFAULT_SECURITY, ...parsed.security };
                addAudit(state.session.user.email, state.session.user.role, 'Restored database from JSON backup', 'warning');
                persistState();
                showToast('Backup restored successfully', 'success');
                render();
              } catch (err) {
                showToast('Invalid JSON backup file', 'error');
              }
            };
            reader.readAsText(file);
          });
        }

        const adminRss = document.getElementById('admin-rss-btn');
        if (adminRss) adminRss.addEventListener('click', () => { downloadFile('a-legal-note-rss.xml', generateRssXml(), 'application/rss+xml'); showToast('RSS XML downloaded', 'success'); });
        const adminCrossref = document.getElementById('admin-crossref-btn');
        if (adminCrossref) {
          adminCrossref.addEventListener('click', () => {
            const first = getPublishedArticles()[0];
            if (first) { downloadFile(`crossref-${first.id}.xml`, generateCrossrefXml(first), 'application/xml'); showToast('Crossref XML downloaded', 'success'); }
          });
        }
        const copySql = document.getElementById('copy-sql-btn');
        if (copySql) copySql.addEventListener('click', () => copyTextToClipboard(SUPABASE_SQL_SCHEMA).then(() => showToast('Supabase SQL schema copied', 'success')));
        const dlSql = document.getElementById('download-sql-btn');
        if (dlSql) dlSql.addEventListener('click', () => { downloadFile('supabase_schema.sql', SUPABASE_SQL_SCHEMA, 'text/sql'); showToast('supabase_schema.sql downloaded', 'success'); });

        renderAdminCharts();
      }

      function completeAdminLogin(user) {
        state.session.authenticated = true;
        state.session.user = user;
        state.session.pending2FAUser = null;
        state.session.active2FACode = null;
        state.session.lastActivity = Date.now();
        addAudit(user.email, user.role, 'Signed in to Admin Panel', 'success');
        showToast(`Welcome, ${user.role}`, 'success');
        startSessionTicker();
        render();
      }

      function touchAdminSession() {
        state.session.lastActivity = Date.now();
      }

      function startSessionTicker() {
        clearInterval(sessionTimerInterval);
        sessionTimerInterval = setInterval(() => {
          if (!state.session.authenticated) { clearInterval(sessionTimerInterval); return; }
          const remainingMs = (state.security.sessionTimeoutMinutes * 60000) - (Date.now() - state.session.lastActivity);
          if (remainingMs <= 0) {
            addAudit(state.session.user.email, 'Security', 'Auto-locked session due to inactivity', 'warning');
            state.session.authenticated = false;
            state.session.user = null;
            clearInterval(sessionTimerInterval);
            showToast('Session expired for security', 'warning');
            render();
            return;
          }
          const el = document.getElementById('session-countdown');
          if (el) {
            const m = Math.floor(remainingMs / 60000);
            const s = Math.floor((remainingMs % 60000) / 1000).toString().padStart(2, '0');
            el.textContent = `${m}:${s}`;
          }
        }, 1000);
      }

      function startLockoutTicker() {
        clearInterval(lockoutTimerInterval);
        lockoutTimerInterval = setInterval(() => {
          const secs = Math.ceil((state.session.lockedUntil - Date.now()) / 1000);
          if (secs <= 0) { clearInterval(lockoutTimerInterval); render(); return; }
          const el = document.getElementById('lockout-secs');
          if (el) el.textContent = secs;
        }, 1000);
      }

      function render() {
        applyTheme();
        updateNavUI();
        const root = document.getElementById('app-root');
        if (state.view === 'journal') root.innerHTML = renderJournalView();
        else if (state.view === 'reader') root.innerHTML = renderReaderView();
        else if (state.view === 'archives') root.innerHTML = renderArchivesView();
        else if (state.view === 'submit') root.innerHTML = renderSubmitView();
        else if (state.view === 'saved') root.innerHTML = renderSavedView();
        else if (state.view === 'admin') root.innerHTML = renderAdminPanel();
        bindViewEvents();
        if (window.lucide) lucide.createIcons();
      }

      // =========================================================================
      // 14. GLOBAL LISTENERS & BOOT
      // =========================================================================
      function init() {
        loadState();

        document.getElementById('brand-home-btn').addEventListener('click', () => navigate('journal'));
        document.querySelectorAll('[data-nav]').forEach(btn => {
          btn.addEventListener('click', () => navigate(btn.getAttribute('data-nav')));
        });
        document.getElementById('mobile-menu-btn').addEventListener('click', () => {
          document.getElementById('mobile-nav').classList.toggle('hidden');
        });
        document.getElementById('cmd-palette-btn').addEventListener('click', openCommandPalette);
        document.getElementById('mobile-cmd-btn').addEventListener('click', () => {
          document.getElementById('mobile-nav').classList.add('hidden');
          openCommandPalette();
        });
        document.getElementById('footer-rss-btn').addEventListener('click', () => {
          downloadFile('a-legal-note-rss.xml', generateRssXml(), 'application/rss+xml');
          showToast('RSS feed downloaded', 'success');
        });
        document.getElementById('theme-cycle-btn').addEventListener('click', () => {
          const order = ['light', 'sepia', 'dark'];
          state.theme = order[(order.indexOf(state.theme) + 1) % order.length];
          persistState();
          render();
        });
        document.getElementById('modal-backdrop').addEventListener('click', (e) => {
          if (e.target.id === 'modal-backdrop') closeModal();
        });

        window.addEventListener('keydown', (e) => {
          if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') {
            e.preventDefault();
            openCommandPalette();
          } else if (e.key === 'Escape') {
            closeModal();
          }
        });

        window.addEventListener('scroll', () => {
          if (state.view !== 'reader') return;
          const bar = document.getElementById('reading-progress-bar');
          if (!bar) return;
          const docH = document.documentElement.scrollHeight - window.innerHeight;
          const pct = docH > 0 ? Math.min(100, Math.max(0, (window.scrollY / docH) * 100)) : 0;
          bar.style.width = pct + '%';
        }, { passive: true });

        render();
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
      } else {
        init();
      }
    })();
  </script>
</body>
</html>
